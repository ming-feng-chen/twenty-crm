name: airpal

services:
  caddy:
    image: caddy:2.10
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      CRM_DOMAIN: ${CRM_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - server

  server:
    image: airpal-twenty:${TAG:-current}
    restart: always
    env_file: twenty.env
    environment: &runtime
      SERVER_URL: https://${CRM_DOMAIN}
      PG_DATABASE_URL: postgres://twenty:${PG_PASSWORD}@db:5432/twenty
      REDIS_URL: redis://redis:6379
      STORAGE_TYPE: local
      NODE_PORT: 3000
    volumes:
      - storage:/app/packages/twenty-server/.local-storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: curl --fail http://localhost:3000/healthz
      interval: 10s
      timeout: 5s
      retries: 60

  worker:
    image: airpal-twenty:${TAG:-current}
    restart: always
    command: ["yarn", "worker:prod"]
    env_file: twenty.env
    environment:
      <<: *runtime
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
    volumes:
      - storage:/app/packages/twenty-server/.local-storage
    depends_on:
      server:
        condition: service_healthy

  db:
    image: postgres:18
    restart: always
    shm_size: 256mb
    environment:
      POSTGRES_DB: twenty
      POSTGRES_USER: twenty
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: pg_isready -U twenty -d twenty
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    restart: always
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  caddy-data:
  caddy-config:
  storage:
  db-data:
  redis-data:
